name: Deploy static site to OSS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: manyuanrong/setup-ossutil@v2.0
        with:
          endpoint: ${{ secrets.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Upload files
        run: |
          ossutil cp -rf ./index.html oss://${{ secrets.OSS_BUCKET }}/
          ossutil cp -rf ./app.js oss://${{ secrets.OSS_BUCKET }}/
          ossutil cp -rf ./styles.css oss://${{ secrets.OSS_BUCKET }}/